basePath: /api/v1
definitions:
  handlers.addressRequest:
    properties:
      city:
        type: string
      full_address:
        type: string
      is_default:
        type: boolean
      phone:
        type: string
      title:
        type: string
    type: object
  handlers.updateProfileRequest:
    properties:
      full_name:
        type: string
      phone:
        type: string
    type: object
  models.Address:
    properties:
      city:
        type: string
      created_at:
        type: string
      full_address:
        type: string
      id:
        type: string
      is_default:
        type: boolean
      phone:
        type: string
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      phone:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: İstifadəçi profilinin oxunması/yenilənməsi üçün REST API. Auth doğrulaması
    authorization-service-ə həvalə edilir.
  title: User Service API
  version: "1.0"
paths:
  /addresses:
    get:
      description: Default ünvan birinci gəlir.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Address'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List the current user's addresses
      tags:
      - addresses
    post:
      consumes:
      - application/json
      description: is_default=true göndərilsə əvvəlki default sıfırlanır — hər istifadəçidə
        maksimum bir default ünvan olur.
      parameters:
      - description: Address payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.addressRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Address'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add an address to the current user's address book
      tags:
      - addresses
  /addresses/{id}:
    delete:
      parameters:
      - description: Address ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete one of the current user's addresses
      tags:
      - addresses
    put:
      consumes:
      - application/json
      parameters:
      - description: Address ID
        in: path
        name: id
        required: true
        type: string
      - description: Address payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.addressRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Address'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update one of the current user's addresses
      tags:
      - addresses
  /profile:
    get:
      description: JWT token-ə uyğun istifadəçinin profilini qaytarır (registration-service-in
        verdiyi token).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user's profile
      tags:
      - profile
    put:
      consumes:
      - application/json
      description: full_name və phone sahələrini yeniləyir (email dəyişmir, registration-service
        tərəfindən idarə olunur).
      parameters:
      - description: Profile update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.updateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update current user's profile
      tags:
      - profile
securityDefinitions:
  BearerAuth:
    description: Bearer token formatında JWT (registration-service /login cavabından).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
