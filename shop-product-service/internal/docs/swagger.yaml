basePath: /api/v1
definitions:
  internal_handlers.productRequest:
    properties:
      description:
        type: string
      name:
        type: string
      price:
        type: number
      shop_id:
        type: string
      stock:
        type: integer
    type: object
  shop-product-service_internal_models.Product:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      price:
        type: number
      shop_id:
        type: string
      stock:
        type: integer
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: Mağaza məhsullarının CRUD idarəetməsi. Yaratma/yeniləmə/silmə üçün
    mağazaya həmin istifadəçi aid olmalı (JWT-də shop_id/shop_role_level ilə) və lazımi
    səviyyəyə sahib olmalıdır; və ya administrator.
  title: Shop Product Service API
  version: "1.0"
paths:
  /products:
    get:
      parameters:
      - description: Filter by shop
        in: query
        name: shop_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/shop-product-service_internal_models.Product'
            type: array
      summary: List products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: add-product(2)+ səviyyəsi olan mağaza əməkdaşı və ya administrator
        əlavə edə bilər.
      parameters:
      - description: Product payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.productRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/shop-product-service_internal_models.Product'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a product
      tags:
      - products
  /products/{id}:
    delete:
      description: review(3)+ səviyyəsi olan mağaza əməkdaşı və ya administrator.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a product
      tags:
      - products
    get:
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/shop-product-service_internal_models.Product'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a product
      tags:
      - products
    put:
      consumes:
      - application/json
      description: add-product(2)+ səviyyəsi olan mağaza əməkdaşı və ya administrator.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Product payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.productRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/shop-product-service_internal_models.Product'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a product
      tags:
      - products
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
