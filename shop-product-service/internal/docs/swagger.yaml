      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ProductItem'
            type: array
      summary: List a product's items/variants
      tags:
      - product-items
    post:
      consumes:
      - application/json
      description: Məsələn "Bayraq" məhsuluna "30x60 1 qat", "100x100 2 qat" kimi
        hər birinin öz qiyməti/stoku/endirimi olan itemlər əlavə edilir. add-product(2)+
        səviyyəli mağaza əməkdaşı və ya administrator.
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: string
      - description: Item payload
        in: body
        name: request
        required: true
