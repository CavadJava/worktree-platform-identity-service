basePath: /api/v1
definitions:
  internal_handlers.productItemRequest:
    properties:
      discount_price:
        type: number
      is_discounted:
        type: boolean
      name:
        type: string
      price:
        type: number
      stock:
        type: integer
    type: object
  internal_handlers.productRequest:
    properties:
      description:
        type: string
      name:
        type: string
      price:
        type: number
      shop_id:
        type: string
      stock:
        type: integer
    type: object
  shop-product-service_internal_models.Product:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      price:
        type: number
      shop_id:
        type: string
      stock:
        type: integer
      updated_at:
        type: string
    type: object
  shop-product-service_internal_models.ProductItem:
    properties:
      created_at:
        type: string
      discount_price:
        type: number
      id:
        type: string
      is_discounted:
        type: boolean
      name:
        type: string
      price:
        type: number
      product_id:
        type: string
      stock:
        type: integer
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: Mağaza məhsullarının CRUD idarəetməsi. Yaratma/yeniləmə/silmə üçün
    mağazaya həmin istifadəçi aid olmalı (JWT-də shop_id/shop_role_level ilə) və lazımi
    səviyyəyə sahib olmalıdır; və ya administrator.
  title: Shop Product Service API
  version: "1.0"
paths:
  /favorites:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/shop-product-service_internal_models.Product'
            type: array
      security:
      - BearerAuth: []
      summary: List my favorite products
      tags:
      - favorites
  /product-items/{id}:
    delete:
      description: review(3)+ səviyyəli mağaza əməkdaşı və ya administrator.
      parameters:
      - description: Product item ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a product item
      tags:
      - product-items
    get:
      parameters:
      - description: Product item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/shop-product-service_internal_models.ProductItem'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a product item
      tags:
      - product-items
    put:
      consumes:
      - application/json
      description: add-product(2)+ səviyyəli mağaza əməkdaşı və ya administrator.
      parameters:
      - description: Product item ID
        in: path
        name: id
        required: true
        type: string
      - description: Item payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.productItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/shop-product-service_internal_models.ProductItem'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a product item
      tags:
      - product-items
  /products:
    get:
      parameters:
      - description: Filter by shop
        in: query
        name: shop_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/shop-product-service_internal_models.Product'
            type: array
      summary: List products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: add-product(2)+ səviyyəsi olan mağaza əməkdaşı və ya administrator
        əlavə edə bilər.
      parameters:
      - description: Product payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.productRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/shop-product-service_internal_models.Product'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a product
      tags:
      - products
  /products/{id}:
    delete:
      description: review(3)+ səviyyəsi olan mağaza əməkdaşı və ya administrator.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a product
      tags:
      - products
    get:
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/shop-product-service_internal_models.Product'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a product
      tags:
      - products
    put:
      consumes:
      - application/json
      description: add-product(2)+ səviyyəsi olan mağaza əməkdaşı və ya administrator.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Product payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.productRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/shop-product-service_internal_models.Product'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a product
      tags:
      - products
  /products/{id}/favorite:
    delete:
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Unfavorite a product
      tags:
      - favorites
    post:
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Favorite a product
      tags:
      - favorites
  /products/{product_id}/items:
    get:
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/shop-product-service_internal_models.ProductItem'
            type: array
      summary: List a product's items/variants
      tags:
      - product-items
    post:
      consumes:
      - application/json
      description: Məsələn "Bayraq" məhsuluna "30x60 1 qat", "100x100 2 qat" kimi
        hər birinin öz qiyməti/stoku/endirimi olan itemlər əlavə edilir. add-product(2)+
        səviyyəli mağaza əməkdaşı və ya administrator.
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: string
      - description: Item payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.productItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/shop-product-service_internal_models.ProductItem'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add a variant/item to a product
      tags:
      - product-items
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
