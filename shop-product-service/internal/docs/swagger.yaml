basePath: /api/v1
definitions:
  handlers.productItemRequest:
    properties:
      discount_price:
        type: number
      is_discounted:
        type: boolean
      name:
        type: string
      price:
        type: number
      stock:
        type: integer
    type: object
  handlers.productRequest:
    properties:
      brand:
        description: |-
          Optional "deep" attributes — absent/omitted means "not set", which
          the response reports back via has_brand/has_material/has_weight/
          has_origin/has_warranty (see models.Product.ComputeFlags).
        type: string
      description:
        type: string
      material:
        type: string
      name:
        type: string
      origin_country:
        type: string
      price:
        type: number
      product_type_id:
        type: string
      shop_id:
        type: string
      stock:
        type: integer
      warranty_months:
        type: integer
      weight_kg:
        type: number
    type: object
  handlers.productSubtypeRequest:
    properties:
      name:
        type: string
    type: object
  handlers.productTypeRequest:
    properties:
      name:
        type: string
      shop_id:
        type: string
    type: object
  models.Product:
    properties:
      brand:
        type: string
      created_at:
        type: string
      description:
        type: string
      has_brand:
        type: boolean
      has_material:
        type: boolean
      has_origin:
        type: boolean
      has_warranty:
        type: boolean
      has_weight:
        type: boolean
      id:
        type: string
      material:
        type: string
      name:
        type: string
      origin_country:
        type: string
      price:
        type: number
      product_type_id:
        type: string
      shop_id:
        type: string
      stock:
        type: integer
      updated_at:
        type: string
      warranty_months:
        type: integer
      weight_kg:
        type: number
    type: object
  models.ProductItem:
    properties:
      created_at:
        type: string
      discount_price:
        type: number
      id:
        type: string
      is_discounted:
        type: boolean
      name:
        type: string
      price:
        type: number
      product_id:
        type: string
      stock:
        type: integer
      updated_at:
        type: string
    type: object
  models.ProductSubtype:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      product_type_id:
        type: string
      updated_at:
        type: string
    type: object
  models.ProductType:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      shop_id:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: Mağaza məhsullarının CRUD idarəetməsi. Yaratma/yeniləmə/silmə üçün
    mağazaya həmin istifadəçi aid olmalı (JWT-də shop_id/shop_role_level ilə) və lazımi
    səviyyəyə sahib olmalıdır; və ya administrator.
  title: Shop Product Service API
  version: "1.0"
paths:
  /favorites:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Product'
            type: array
      security:
      - BearerAuth: []
      summary: List my favorite products
      tags:
      - favorites
  /product-items/{id}:
    delete:
      description: review(3)+ səviyyəli mağaza əməkdaşı və ya administrator.
      parameters:
      - description: Product item ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a product item
      tags:
      - product-items
    get:
      parameters:
      - description: Product item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ProductItem'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a product item
      tags:
      - product-items
    put:
      consumes:
      - application/json
      description: add-product(2)+ səviyyəli mağaza əməkdaşı və ya administrator.
      parameters:
      - description: Product item ID
        in: path
        name: id
        required: true
        type: string
      - description: Item payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.productItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ProductItem'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a product item
      tags:
      - product-items
  /product-subtypes/{id}:
    delete:
      description: review(3)+ səviyyəli mağaza əməkdaşı və ya administrator.
      parameters:
      - description: Product subtype ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a product subtype
      tags:
      - product-types
    put:
      consumes:
      - application/json
      description: add-product(2)+ səviyyəli mağaza əməkdaşı və ya administrator.
      parameters:
      - description: Product subtype ID
        in: path
        name: id
        required: true
        type: string
      - description: Name payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.productSubtypeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ProductSubtype'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a product subtype
      tags:
      - product-types
  /product-types:
    get:
      parameters:
      - description: Shop ID
        in: query
        name: shop_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ProductType'
            type: array
      summary: List a shop's product types
      tags:
      - product-types
    post:
      consumes:
      - application/json
      description: Məsələn "Ölçü". add-product(2)+ səviyyəli mağaza əməkdaşı və ya
        administrator əlavə edə bilər.
      parameters:
      - description: Product type payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.productTypeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ProductType'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a product type (növ) for a shop
      tags:
      - product-types
  /product-types/{id}:
    delete:
      description: review(3)+ səviyyəli mağaza əməkdaşı və ya administrator.
      parameters:
      - description: Product type ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a product type
      tags:
      - product-types
    get:
      parameters:
      - description: Product type ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ProductType'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a product type
      tags:
      - product-types
    put:
      consumes:
      - application/json
      description: add-product(2)+ səviyyəli mağaza əməkdaşı və ya administrator.
      parameters:
      - description: Product type ID
        in: path
        name: id
        required: true
        type: string
      - description: Name payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.productSubtypeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ProductType'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a product type
      tags:
      - product-types
  /product-types/{type_id}/subtypes:
    get:
      parameters:
      - description: Product type ID
        in: path
        name: type_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ProductSubtype'
            type: array
      summary: List a product type's subtypes
      tags:
      - product-types
    post:
      consumes:
      - application/json
      description: Məsələn "Ölçü" növünə "En", "Uzunluq" alt növləri. add-product(2)+
        səviyyəli mağaza əməkdaşı və ya administrator.
      parameters:
      - description: Product type ID
        in: path
        name: type_id
        required: true
        type: string
      - description: Subtype payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.productSubtypeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ProductSubtype'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add a subtype (alt növ) to a product type
      tags:
      - product-types
  /products:
    get:
      parameters:
      - description: Filter by shop
        in: query
        name: shop_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Product'
            type: array
      summary: List products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: add-product(2)+ səviyyəsi olan mağaza əməkdaşı və ya administrator
        əlavə edə bilər.
      parameters:
      - description: Product payload
        in: body
        name: request
        required: true
