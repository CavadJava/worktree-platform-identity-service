basePath: /api/v1
definitions:
  handlers.paymentItemRequest:
    properties:
      product_id:
        type: string
      product_name:
        type: string
      quantity:
        type: integer
      unit_price:
        type: number
    type: object
  handlers.paymentRequest:
    properties:
      amount:
        type: number
      items:
        items:
          $ref: '#/definitions/handlers.paymentItemRequest'
        type: array
      order_id:
        type: string
      shop_id:
        type: string
      user_id:
        type: string
    type: object
  models.Payment:
    properties:
      amount:
        type: number
      created_at:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/models.PaymentItem'
        type: array
      order_id:
        type: string
      shop_id:
        type: string
      status:
        type: string
      user_id:
        type: string
    type: object
  models.PaymentItem:
    properties:
      id:
        type: string
      payment_id:
        type: string
      product_id:
        type: string
      product_name:
        type: string
      quantity:
        type: integer
      unit_price:
        type: number
    type: object
  models.ShopBalance:
    properties:
      balance:
        type: number
      shop_id:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: Sifariş ödənişlərinin qeydiyyatı və mağazaların müvəqqəti bakiyəsi.
    shop-order-service hər sifariş yaradılandan sonra bura POST /payments göndərir;
    mağaza öz ödənişlərini və bakiyəsini burdan izləyir.
  title: Payment Service API
  version: "1.0"
paths:
  /payments:
    post:
      consumes:
      - application/json
      description: Internal, service-to-service call (no auth — same convention as
        notification-service's POST /notifications) made once by shop-order-service
        right after it creates an order. Credits the shop's balance atomically.
      parameters:
      - description: Payment payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.paymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Payment'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Record a completed payment for an order
      tags:
      - payments
  /shops/{id}/balance:
    get:
      description: chat(1)+ səviyyəli mağaza əməkdaşı (öz mağazasında) və ya administrator.
        Bu bakiyə hələ ki yalnız payment-service daxilində yaşayır — real mağaza bank
        hesabına köçürmə gələcək bir funksiyadır.
      parameters:
      - description: Shop ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ShopBalance'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a shop's (temporary) balance
      tags:
      - payments
  /shops/{id}/payments:
    get:
      description: chat(1)+ səviyyəli mağaza əməkdaşı (öz mağazasında) və ya administrator.
      parameters:
      - description: Shop ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Payment'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List a shop's payments
      tags:
      - payments
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
