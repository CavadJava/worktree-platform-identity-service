basePath: /api/v1
definitions:
  internal_handlers.upsertRequest:
    properties:
      key:
        type: string
      locale:
        type: string
      namespace:
        type: string
      value:
        type: string
    type: object
  localization-service_internal_models.Translation:
    properties:
      created_at:
        type: string
      id:
        type: string
      key:
        type: string
      locale:
        type: string
      namespace:
        type: string
      updated_at:
        type: string
      value:
        type: string
    type: object
info:
  contact: {}
  description: Sistemdəki bütün mətnlərin/xəta mesajlarının çoxdilli (az/en/ru) idarəetməsi.
    Oxumaq (list/map/lookup/locales) public-dir; yaratma/yeniləmə/silmə yalnız administrator
    üçündür.
  title: Localization Service API
  version: "1.0"
paths:
  /locales:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: List locales currently in use
      tags:
      - translations
  /translations:
    get:
      description: Filtrlər opsionaldır. Public — auth tələb olunmur (login/xəta səhifələri
        autentifikasiyadan əvvəl tərcümələrə ehtiyac duya bilər).
      parameters:
      - description: Filter by namespace
        in: query
        name: namespace
        type: string
      - description: Filter by locale
        in: query
        name: locale
        type: string
      - description: Filter by key
        in: query
        name: key
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/localization-service_internal_models.Translation'
            type: array
      summary: List translations
      tags:
      - translations
    post:
      consumes:
      - application/json
      description: (namespace, key, locale) üçlüyü artıq mövcuddursa dəyərini yeniləyir,
        yoxdursa yaradır.
      parameters:
      - description: Translation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.upsertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/localization-service_internal_models.Translation'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create or update a translation (administrator only)
      tags:
      - translations
  /translations/{id}:
    delete:
      parameters:
      - description: Translation ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a translation (administrator only)
      tags:
      - translations
  /translations/lookup:
    get:
      parameters:
      - description: Namespace
        in: query
        name: namespace
        required: true
        type: string
      - description: Key
        in: query
        name: key
        required: true
        type: string
      - description: Locale
        in: query
        name: locale
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/localization-service_internal_models.Translation'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a single translation, with default-locale fallback
      tags:
      - translations
  /translations/map:
    get:
      description: Bir dəfə yüklənib client tərəfdə birbaşa istifadə edilməsi üçün
        ən rahat format.
      parameters:
      - description: Namespace
        in: query
        name: namespace
        required: true
        type: string
      - description: Locale
        in: query
        name: locale
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a namespace's translations as a key→value map
      tags:
      - translations
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
