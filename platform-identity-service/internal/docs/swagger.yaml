basePath: /api/v1
definitions:
  handlers.createProjectRequest:
    properties:
      name:
        type: string
    type: object
  handlers.loginRequest:
    properties:
      identifier:
        type: string
      password:
        type: string
    type: object
  handlers.loginResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
    type: object
  handlers.projectResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  handlers.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      project_id:
        type: string
      username:
        type: string
    type: object
  handlers.setRoleRequest:
    properties:
      role:
        type: string
    type: object
  handlers.userResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      project_id:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: Gələcək layihələr üçün mərkəzi User/Admin qeydiyyat modulu. Hər layihənin
    ilk qeydiyyatdan keçən useri avtomatik admin olur, sonrakılar user. Öz JWT-sini
    özü verir/yoxlayır.
  title: Platform Identity Service API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.loginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log in with username or email
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Layihənin ilk qeydiyyatdan keçən useri avtomatik 'admin' olur,
        sonrakılar 'user'. role sahəsi qəbul edilmir — client özünü admin edə bilməz.
      parameters:
      - description: Register payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.userResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a user under a project
      tags:
      - auth
  /projects:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.projectResponse'
            type: array
      summary: List all projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Açıq endpoint — sistem-səviyyəli superadmin anlayışı hələ yoxdur,
        yeni layihə qurmaq istəyən istənilən kəs çağıra bilər.
      parameters:
      - description: Project payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.createProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.projectResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new project
      tags:
      - projects
  /projects/{id}:
    get:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.projectResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a project by id
      tags:
      - projects
  /users/{id}:
    get:
      description: Özünü, ya da (admin rolunda olarsa) öz layihəsindəki istənilən
        useri görə bilər.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.userResponse'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a user
      tags:
      - users
  /users/{id}/role:
    post:
      consumes:
      - application/json
      description: Yalnız caller öz layihəsinin admin-idirsə icazə verilir.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Role payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.setRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.userResponse'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change a user's role
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
