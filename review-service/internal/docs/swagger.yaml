basePath: /api/v1
definitions:
  handlers.reviewRequest:
    properties:
      rating:
        type: integer
      text:
        type: string
    type: object
  models.Review:
    properties:
      created_at:
        type: string
      id:
        type: string
      media:
        items:
          $ref: '#/definitions/models.ReviewMedia'
        type: array
      product_id:
        type: string
      rating:
        type: integer
      text:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.ReviewMedia:
    properties:
      created_at:
        type: string
      id:
        type: string
      media_type:
        description: '"image" | "video"'
        type: string
      review_id:
        type: string
      url:
        type: string
    type: object
info:
  contact: {}
  description: Məhsullara reyting/mətn rəyi və şəkil/video əlavə etmək üçün REST API.
    Fayllar diskdə saxlanılır, /media/* altında verilir.
  title: Review Service API
  version: "1.0"
paths:
  /products/{product_id}/reviews:
    get:
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Review'
            type: array
      summary: List a product's reviews (newest first)
      tags:
      - reviews
    post:
      consumes:
      - application/json
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: string
      - description: Review payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.reviewRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Review'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Write a review for a product
      tags:
      - reviews
  /reviews/{id}:
    delete:
      parameters:
      - description: Review ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete your own review
      tags:
      - reviews
  /reviews/{id}/media:
    post:
      consumes:
      - multipart/form-data
      description: 'multipart/form-data with a single "file" field. Images: jpeg/png/webp/heic.
        Video: mp4/mov. Max 25MB.'
      parameters:
      - description: Review ID
        in: path
        name: id
        required: true
        type: string
      - description: Photo or video file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ReviewMedia'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Attach a photo or short clip to your review
      tags:
      - reviews
swagger: "2.0"
