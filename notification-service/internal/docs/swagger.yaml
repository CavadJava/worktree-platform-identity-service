basePath: /api/v1
definitions:
  handlers.sendNotificationRequest:
    properties:
      full_name:
        type: string
      message:
        type: string
      to:
        type: string
      type:
        type: string
      user_id:
        description: verilsə bildiriş inbox-da saxlanılır
        type: string
    type: object
  handlers.sendNotificationResponse:
    properties:
      status:
        type: string
      stored:
        type: boolean
    type: object
  models.Notification:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_read:
        type: boolean
      message:
        type: string
      type:
        type: string
      user_id:
        type: string
    type: object
info:
  contact: {}
  description: Bildirişləri qəbul edib (mock) göndərən REST API. Real provider inteqrasiyası
    yoxdur, konsola loglayır.
  title: Notification Service API
  version: "1.0"
paths:
  /notifications:
    get:
      parameters:
      - description: Default 50, max 200
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Notification'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List the current user's notifications (inbox)
      tags:
      - notifications
    post:
      consumes:
      - application/json
      description: Real provayder yoxdur — konsola loglanır (mock). `user_id` verilsə
        bildiriş həmçinin istifadəçinin inbox-unda saxlanılır və GET /notifications
        ilə oxuna bilir.
      parameters:
      - description: Notification payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.sendNotificationRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.sendNotificationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Send a notification
      tags:
      - notifications
  /notifications/{id}/read:
    put:
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mark one of the current user's notifications as read
      tags:
      - notifications
  /notifications/read-all:
    put:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mark all of the current user's notifications as read
      tags:
      - notifications
  /notifications/unread-count:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: integer
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Count the current user's unread notifications
      tags:
      - notifications
swagger: "2.0"
